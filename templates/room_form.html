{% extends 'base.html' %}
{% block title %}{{ 'Edit Room' if room else 'Add Room' }} - HotelMS{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit Room' if room else 'Add New Room' }}</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Room Number</label>
                <input type="text" name="room_number" class="form-control" value="{{ room.room_number if room else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Room Type</label>
                <select name="room_type" class="form-select" required>
                    {% for t in ['Single', 'Double', 'Deluxe', 'Suite'] %}
                    <option value="{{ t }}" {% if room and room.room_type == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Price per Night ($)</label>
                <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ room.price if room else '' }}" required>
            </div>
            {% if room %}
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in ['Available', 'Occupied', 'Maintenance'] %}
                    <option value="{{ s }}" {% if room.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('rooms') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
